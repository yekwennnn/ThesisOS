name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir dist .
      - name: Install wheel
        run: python -m pip install --disable-pip-version-check dist/*.whl
      - name: Smoke-test installed resources outside checkout
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          python - <<'PY'
          from thesisos.model_runtime import PromptCatalog
          from thesisos.schema_validation import SchemaCatalog

          assert len(SchemaCatalog().schemas) == 6
          assert PromptCatalog().load("evidence-extraction").contract_id == "evidence-extraction"
          PY
      - name: Smoke-test target install outside checkout
        shell: bash
        run: |
          target_dir="$(mktemp -d)"
          smoke_dir="$(mktemp -d)"
          python -m pip install --disable-pip-version-check --no-deps --target "$target_dir" dist/*.whl
          cd "$smoke_dir"
          PYTHONPATH="$target_dir" python - <<'PY'
          from thesisos.model_runtime import PromptCatalog
          from thesisos.schema_validation import SchemaCatalog

          assert len(SchemaCatalog().schemas) == 6
          assert PromptCatalog().load("thesis-diff").contract_id == "thesis-diff"
          PY
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m unittest discover -s tests -v

  windows-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir dist .
      - name: Install wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          python -m pip install --disable-pip-version-check $wheel.FullName
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
